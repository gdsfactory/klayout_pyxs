name: Test code and lint

on:
  pull_request:
  push:
  schedule:
    - cron: 0 2 * * * # run at 2 AM UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / KLayout ${{ matrix.klayout_version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            download_dir: Ubuntu-22
            klayout_version: "0.28.17"
            klayout_sha256: "2e453ea4594b0f98bc690e24f01aa8f85cfb2c1a8b3537235dfefb6c24e7f5c3"
          - os: ubuntu-24.04
            download_dir: Ubuntu-24
            klayout_version: "0.30.10"
            klayout_sha256: "558ea6d6729cd119041481d22099a5c080ef59e3ebc17da9aa301d11a7faf407"

    env:
      KLAYOUT_VERSION: ${{ matrix.klayout_version }}
      KLAYOUT_DOWNLOAD_DIR: ${{ matrix.download_dir }}
      KLAYOUT_SHA256: ${{ matrix.klayout_sha256 }}

    steps:
      - uses: actions/checkout@v6

      - name: Restore KLayout archive
        id: klayout-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/klayout_${{ matrix.klayout_version }}-1_amd64.deb
          key: klayout-linux-${{ matrix.os }}-${{ matrix.klayout_version }}-${{ matrix.klayout_sha256 }}

      - name: Install KLayout
        run: |
          package="klayout_${KLAYOUT_VERSION}-1_amd64.deb"
          url="https://www.klayout.org/downloads/${KLAYOUT_DOWNLOAD_DIR}/${package}"
          archive="$RUNNER_TEMP/$package"

          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --output "$archive" "$url"
          fi
          echo "${KLAYOUT_SHA256}  ${archive}" | sha256sum --check -

          sudo apt-get update
          sudo apt-get install --yes "$archive"

          klayout -v

      - name: Run regression tests
        run: |
          cd tests
          bash run_tests.sh
          bash run_tests_3d.sh

  windows:
    name: Windows / KLayout ${{ matrix.klayout_version }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          # KLayout publishes an MD5 for this legacy portable archive.
          - klayout_version: "0.28.17"
            checksum_algorithm: MD5
            klayout_checksum: "a2ea72713c49c35ebb3eddd10b17d727"
          - klayout_version: "0.30.10"
            checksum_algorithm: SHA256
            klayout_checksum: "298d1aaf49dd73240031a91de66103177af821956e14fe46a549d987963c6ff1"

    env:
      KLAYOUT_VERSION: ${{ matrix.klayout_version }}
      KLAYOUT_CHECKSUM_ALGORITHM: ${{ matrix.checksum_algorithm }}
      KLAYOUT_CHECKSUM: ${{ matrix.klayout_checksum }}

    steps:
      - uses: actions/checkout@v6

      - name: Restore KLayout archive
        id: klayout-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/klayout-${{ matrix.klayout_version }}-win64.zip
          key: klayout-windows-${{ matrix.klayout_version }}-${{ matrix.checksum_algorithm }}-${{ matrix.klayout_checksum }}

      - name: Install KLayout
        shell: pwsh
        run: |
          $package = "klayout-$env:KLAYOUT_VERSION-win64.zip"
          $url = "https://www.klayout.org/downloads/Windows/$package"
          $archive = Join-Path $env:RUNNER_TEMP $package
          $destination = Join-Path $env:RUNNER_TEMP "klayout"

          if (-not (Test-Path $archive)) {
            $maxAttempts = 3
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 120 -ErrorAction Stop
                break
              }
              catch {
                Remove-Item -Force $archive -ErrorAction SilentlyContinue
                if ($attempt -eq $maxAttempts) {
                  throw
                }
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
          }
          $algorithm = $env:KLAYOUT_CHECKSUM_ALGORITHM
          $hash = (Get-FileHash -Algorithm $algorithm $archive).Hash.ToLowerInvariant()
          if ($hash -ne $env:KLAYOUT_CHECKSUM) {
            throw "Unexpected $algorithm checksum for ${package}: $hash"
          }

          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $folder = [System.IO.Path]::GetFileNameWithoutExtension($package)
          $klayout = Join-Path $destination "$folder\klayout_app.exe"
          & $klayout -v
          "KLAYOUT_BIN=$klayout" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run regression tests
        shell: bash
        run: |
          bash tests/run_tests.sh
          bash tests/run_tests_3d.sh
